[project]
name = "scrapeonce"
version = "0.1.0"
description = "No-code scraping workflows: AI helps build the flow once, every run is deterministic and AI-free."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "apscheduler>=3.10,<4",
    "sse-starlette>=2.1",
    "jinja2>=3.1",
    "tzdata>=2024.1",
    "aiosqlite>=0.22.1",
    "pydantic-ai-slim[anthropic,google,groq]>=2.66.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "req(id): requirement this test proves, e.g. FR-03 (used by scripts/trace_table.py)",
    "contract: uses scripted or recorded AI replies, no real model call",
    "live: calls a real AI model or the deployed URL; never run in CI",
]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
